[build-system]
requires = [
    "setuptools >= 62.3.0",
    "wheel >= 0.29.0",
]
build-backend = 'setuptools.build_meta'

[project]
name = 'CHAMPAGNE'
dynamic = ['version','readme']
description = "CHromAtin iMmuno PrecipitAtion sequencinG aNalysis pipEline"
keywords = ["bioinformatics", "nextflow"]
authors = [
    {name = "Kelly Sovacool", email = "kelly.sovacool@nih.gov"},
    {name = "Vishal Koparde", email = "vishal.koparde@nih.gov"},
]
maintainers = [
    {name = "CCR Collaborative Bioinformatics Resource", email = "ccbr@mail.nih.gov"},
]
license = {file = "LICENSE"}
classifiers = [
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT license",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml >= 6.0",
    "Click >= 8.1.3",
    "ccbr_tools@git+https://github.com/CCBR/Tools@v0.4"
]

[project.optional-dependencies]
dev = [
    "black >= 22.0.0",
    "pre-commit",
    "nf-core >= 3.2.0"
]
test = [
    "pytest"
]
docs = [
    "quarto-version-selector @ git+https://github.com/CCBR/quarto-version-selector.git@main"
]

[project.scripts]
champagne = "champagne.src.__main__:main"

[project.urls]
Homepage = "https://ccbr.github.io/CHAMPAGNE"
Documentation = "https://ccbr.github.io/CHAMPAGNE"
Repository = "https://github.com/CCBR/CHAMPAGNE"
Changelog = "https://github.com/CCBR/CHAMPAGNE/blob/main/CHANGELOG.md"

[tool.setuptools.package-dir]
champagne = "."

[tool.setuptools.package-data]
"*" = ["CITATION.cff", "LICENSE", "VERSION", "main.nf", "nextflow.config", "nextflow_schema.json", "assets/**", "bin/**", "conf/**", "lib/**", "modules/**", "subworkflows/**", "tests/**"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
readme = {file = "README.md"}

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
CHAMPAGNE = { path = ".", editable = true }

[tool.pixi.feature.test]
channels = ["bioconda"]

[tool.pixi.feature.test.target.osx-arm64.dependencies]
nextflow = ">=25.10.4,<26"

[tool.pixi.feature.test.tasks]
test-podman = "nf-test test --profile +podman"

[tool.pixi.feature.docs.dependencies]
quarto = ">=1.9,<2"

[tool.pixi.feature.docs.tasks]
docs-render = "quarto render docs"
docs-preview = "quarto preview docs"
docs-serve = { cmd = "quarto-version-selector serve --site-dir docs/_site", depends-on = ["docs-render"] }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tool.pixi.tasks]
